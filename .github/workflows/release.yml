name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: sh scripts/release-check.sh "${GITHUB_REF_NAME#v}"
      - name: Publish unless this version is already on crates.io
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl --fail --silent --show-error "https://crates.io/api/v1/crates/tclok/${version}" >/dev/null; then
            echo "tclok ${version} is already published"
          else
            cargo publish --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
